<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171314" media="(prefers-color-scheme: dark)">
<title>Sahifa topilmadi — MyStudent</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/mystudent/favicon.svg">

<!-- Bu sahifa mustaqil turadi: style.css ni kutmaydi, chunki
     noto'g'ri havolada u ham topilmasligi mumkin. Ranglar
     ilovaning o'zi bilan bir xil. -->
<style>
:root{
  --brand:#C0392B; --ink:#1C1517; --ink-3:#736567; --ink-4:#A69B9C;
  --line:#EFEBEB; --surface:#FFFFFF; --bg:#F7F4F4; --on-brand:#fff;
  --nores:#E0BFBC;
  --font:"Inter","Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --brand:#E5695B; --ink:#F2EDED; --ink-3:#9C9091; --ink-4:#6F6567;
    --line:#332B2D; --surface:#211C1E; --bg:#171314; --on-brand:#1A1214;
    --nores:#5C2F29;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  min-height:100dvh;display:grid;place-items:center;padding:24px;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
}
.box{text-align:center;max-width:340px}
.box svg{width:104px;height:104px;margin-bottom:20px}
.code{
  font-size:13px;font-weight:700;color:var(--ink-4);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;
}
h1{font-size:22px;font-weight:750;letter-spacing:-.03em;line-height:1.25}
p{margin-top:10px;font-size:14px;color:var(--ink-3);line-height:1.55}
.btn{
  display:inline-block;margin-top:24px;background:var(--brand);color:var(--on-brand);
  text-decoration:none;font-size:14.5px;font-weight:650;letter-spacing:-.012em;
  padding:13px 26px;border-radius:99px;
  transition:transform .15s cubic-bezier(.22,.75,.28,1),opacity .15s;
}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<main class="box">
  <!-- ilovadagi "topilmadi" tasviri bilan bir xil -->
  <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="42" cy="42" r="31" stroke="var(--nores)" stroke-width="7"/>
    <circle cx="32" cy="37" r="3.4" fill="var(--nores)"/>
    <circle cx="52" cy="37" r="3.4" fill="var(--nores)"/>
    <path d="M32 54c5-5 15-5 20 0" stroke="var(--nores)" stroke-width="5" stroke-linecap="round"/>
    <path d="M65 65 88 88" stroke="var(--nores)" stroke-width="7" stroke-linecap="round"/>
  </svg>

  <div class="code">404</div>
  <h1>Sahifa topilmadi</h1>
  <p>Siz izlagan sahifa mavjud emas yoki ko'chirilgan bo'lishi mumkin.</p>
  <a class="btn" href="/mystudent/">Bosh sahifaga qaytish</a>
</main>

</body>
</html>
