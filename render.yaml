# Render.com uchun sozlama — bepul reja.
#
# Baza Render'da EMAS, Neon'da (neon.tech) — chunki Render'ning
# bepul PostgreSQL'i 30 kundan keyin o'chadi, Neon'niki esa
# muddatsiz ishlaydi.
#
# Shuning uchun bu yerda faqat veb-servis. Bazaga ulanish satri
# (DATABASE_URL) Render panelidan qo'lda kiritiladi:
#
#   Servis -> Environment -> Add Environment Variable
#   Key:   DATABASE_URL
#   Value: postgresql://...  (Neon bergan satr)
#
# DATABASE_URL kiritilmasa ham ilova ishlaydi — faqat arizalar
# vaqtinchalik bo'ladi (server qayta ishga tushsa yo'qoladi).

services:
  - type: web
    name: mystudent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salom
    envVars:
      # Qiymat Render panelidan kiritiladi (sync: false — bu yerda
      # yozilmaydi, chunki maxfiy parol git'ga tushmasligi kerak).
      - key: DATABASE_URL
        sync: false
